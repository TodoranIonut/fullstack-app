<div [formGroup]="form()" class="space-y-4">
    <h2 class="text-lg font-semibold text-text">Delivery Address</h2>

    <div>
        <label for="streetAddress" class="block text-sm font-medium text-text-muted mb-1">
            Street Address
        </label>
        <input
            id="streetAddress"
            type="text"
            formControlName="streetAddress"
            class="w-full px-3 py-2 border rounded-md bg-surface border-border text-text focus:ring-2 focus:ring-ring focus:border-transparent"
        />
        <app-error-message [control]="form().get('streetAddress')" />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
            <label for="city" class="block text-sm font-medium text-text-muted mb-1">City</label>
            <input
                id="city"
                type="text"
                formControlName="city"
                class="w-full px-3 py-2 border rounded-md bg-surface border-border text-text focus:ring-2 focus:ring-ring focus:border-transparent"
            />
            <app-error-message [control]="form().get('city')" />
        </div>

        <div>
            <label for="county" class="block text-sm font-medium text-text-muted mb-1">
                County
            </label>
            <input
                id="county"
                type="text"
                formControlName="county"
                class="w-full px-3 py-2 border rounded-md bg-surface border-border text-text focus:ring-2 focus:ring-ring focus:border-transparent"
            />
            <app-error-message [control]="form().get('county')" />
        </div>
    </div>

    <div>
        <label for="country" class="block text-sm font-medium text-text-muted mb-1">Country</label>
        <input
            id="country"
            type="text"
            formControlName="country"
            class="w-full px-3 py-2 border rounded-md bg-surface border-border text-text focus:ring-2 focus:ring-ring focus:border-transparent"
        />
        <app-error-message [control]="form().get('country')" />
    </div>
</div>
